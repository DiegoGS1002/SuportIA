services:

    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: suportia-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            - mysql

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: suportia-queue
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan queue:work --tries=3 --timeout=300
        volumes:
            - ./:/var/www
        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: nginx:latest
        container_name: suportia-nginx
        restart: unless-stopped
        ports:
            - "127.0.0.1:8003:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    mysql:
        image: mysql:9.7
        container_name: suportia-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: suportia
            MYSQL_USER: suportia
            MYSQL_PASSWORD: 123456
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 20s
            retries: 10

volumes:
    mysql_data:
